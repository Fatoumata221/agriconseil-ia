# Déploiement tout-en-un sur Render (offre gratuite) : l'API Express sert aussi le front compilé.
# Render > New > Blueprint > choisir ce dépôt. La clé GROQ_API_KEY se saisit dans le tableau de bord.
services:
  - type: web
    name: agriconseil-ia
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GROQ_API_KEY
        sync: false
